:root{--bg:#e8f6f3;--ink:#344d49;--aqua:#8fc7bd;--aqua-border:#9ccbc3;--aqua-soft:#f5fbf9;--muted:#718984}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Jost',sans-serif;font-weight:400}
main{width:min(100% - 42px,460px);margin:0 auto;padding:54px 0 44px;text-align:center}
.avatar{width:144px;height:144px;margin:0 auto 28px;border-radius:50%;display:grid;place-items:center;border:1px solid #a9d4cc;background:linear-gradient(145deg,#f8fffd,#cce9e2);box-shadow:0 10px 30px #527d7410}
.avatar span{font:500 72px/1 'Cormorant Garamond',serif;color:#588d83}
.brand{font:400 30px/1.1 'Jost',sans-serif;letter-spacing:.16em;text-transform:uppercase;margin:0 0 9px;color:#355c55}
.tagline{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#789b94;margin:0 0 38px}
.links{display:grid;gap:10px}
.link{min-height:56px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--aqua-border);border-radius:999px;padding:11px 18px;color:#42675f;background:rgba(255,255,255,.32);font:400 18px 'Jost',sans-serif;letter-spacing:-.015em;text-decoration:none;transition:background .2s,border-color .2s,transform .2s}
.link:hover{background:#f7fffc;border-color:#70b3a7;transform:translateY(-1px)}
.link.primary{background:#d2ebe5;border-color:#a4d0c7;color:#315c54}
.footer{margin:76px -21px 0;position:relative;min-height:300px;padding:42px 20px 185px;overflow:hidden}
.footer-brand{position:relative;z-index:2;font:400 24px 'Jost',sans-serif;letter-spacing:.18em;color:#47766d}
.footer-note{position:relative;z-index:2;font-size:10px;letter-spacing:.12em;color:#789b94;margin-top:10px}
@media(min-height:850px){main{padding-top:78px}.footer{margin-top:82px}}
@media(max-width:380px){main{width:calc(100% - 34px)}.link{min-height:52px;font-size:17px}.footer{margin-left:-17px;margin-right:-17px}}

/* D'Ferrer Beauty — identidade tipográfica oficial */
:root{--font-display:'Cormorant Garamond',Georgia,serif;--font-body:'Poppins',Arial,sans-serif}
html,body,button,input,textarea,select{font-family:var(--font-body)!important}
body{font-family:var(--font-body)!important}
p,li,label,small,button,a,.btn,.link,.book,.back,.tabs a,.navlinks,.eyebrow,.section-kicker,.section-label,.tagline,.footer-note,.stat span{font-family:var(--font-body)!important}

body{background:#FFF9F6!important}.footer{background:#FFF9F6!important;color:#382B35;min-height:330px;padding-bottom:0}.footer-brand{color:#075F5B!important}.footer-note{color:#64817D!important}.floral-border{position:absolute;left:0;right:0;bottom:0;width:100%;height:250px;pointer-events:none}
